name: Enterprise CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jenosize
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: jenosize
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run prisma:seed
      - run: npx tsc --noEmit
      - run: npm run build:no-generate
      - run: npx playwright install --with-deps
      - run: npx playwright test
        env:
          DATABASE_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          DIRECT_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          SESSION_SECRET: "ci-test-secret-12345678901234567890"
          ALLOW_TEST_HOOKS: "true"
          AI_MOCK_MODE: "true"
          LINE_MOCK_MODE: "true"
          PORT: "3021"

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=critical || true
