name: Enterprise CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jenosize
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: jenosize
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          DIRECT_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
      - run: npm run prisma:seed
        env:
          DATABASE_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          DIRECT_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
      - run: npx tsc --noEmit
      - run: npm run build:no-generate
        env:
          DATABASE_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          DIRECT_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          SESSION_SECRET: "mock_session_secret_for_ci_build_test_only" # gitleaks:allow
          LINE_CHANNEL_SECRET: "mock_line_channel_secret_for_ci_test_only" # gitleaks:allow
          LINE_CHANNEL_ACCESS_TOKEN: "mock_line_channel_access_token_for_ci_test_only" # gitleaks:allow
      - run: npx playwright install --with-deps
      - run: npx playwright test
        env:
          DATABASE_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          DIRECT_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          SESSION_SECRET: "mock_session_secret_for_ci_build_test_only" # gitleaks:allow
          LINE_CHANNEL_SECRET: "mock_line_channel_secret_for_ci_test_only" # gitleaks:allow
          LINE_CHANNEL_ACCESS_TOKEN: "mock_line_channel_access_token_for_ci_test_only" # gitleaks:allow
          ALLOW_TEST_HOOKS: "true"
          AI_MOCK_MODE: "true"
          LINE_MOCK_MODE: "true"
          PORT: "3021"

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      # Dependency vulnerability scan (non-blocking threshold for CI)
      - run: npm audit --audit-level=critical || true

      # CodeQL SAST Analysis
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        continue-on-error: true

      # Secret scanning with Gitleaks
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
