name: Enterprise CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jenosize
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: jenosize
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx prisma db push
      - run: npm run prisma:seed
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps
      - run: npx playwright test
        env:
          DATABASE_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          DIRECT_URL: "postgresql://jenosize:devpass@localhost:5432/jenosize?schema=public"
          SESSION_SECRET: "ci-test-secret-12345678901234567890"
          ALLOW_TEST_HOOKS: "true"
          AI_MOCK_MODE: "true"
          LINE_MOCK_MODE: "true"

  # Runs in parallel with quality-gate; does not block it.
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      # Dependency vulnerability scan. Threshold is "critical" (not "high") because
      # `npm audit --audit-level=high` currently fails on 5 pre-existing high-severity
      # findings in next/postcss/glob that only resolve via breaking major upgrades
      # (see npm audit fix --force). Revisit this threshold after that upgrade.
      - run: npm audit --audit-level=critical

      # CodeQL SAST. Free tier applies automatically for public repos; private repos
      # need GitHub Advanced Security for this to run without failing on quota.
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

      # Secret scanning. No account/token setup required for public/personal repos.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
